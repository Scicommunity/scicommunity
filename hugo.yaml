baseURL: https://sci.community/
languageCode: ru-RU
title: SciCommunity
theme: hugo-book
ignoreFiles:
  - "content/local_base/.*"
  - "copilot/.*"
  - ".obsidian/.*"
  - ".idea/.*"
taxonomies:
  # глобальные, если они уже есть:
  category: categories
  tag: tags

  # книжные:
  booktag: booktags # интересы / ключевые слова книг
  bookgenre: bookgenres # жанры / тематики книг
  bookshelf: bookshelves # полки / подборки для сообщества

markup:
  goldmark:
    renderer:
      unsafe: true

